<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <defs>
    <!-- Arrow marker for grounding relation -->
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2c3e50"/>
    </marker>
    <!-- Subtle gradient for boxes -->
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="380" height="420" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 1: Chi (primitive ontology) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="115" y="45" width="150" height="70" rx="6" ry="6"
        fill="url(#boxGradient)" stroke="#34495e" stroke-width="1.5"/>
  <text x="190" y="92" font-family="Times New Roman, Times, serif" font-size="40"
        font-style="italic" fill="#1a252f" text-anchor="middle">χ</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- ARROW 1: Grounding relation -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <line x1="190" y1="115" x2="190" y2="178"
        stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Grounding label -->
  <text x="210" y="145" font-family="Times New Roman, Times, serif" font-size="14"
        fill="#495057" text-anchor="start" font-style="italic">Grounding</text>
  <text x="210" y="163" font-family="Times New Roman, Times, serif" font-size="14"
        fill="#495057" text-anchor="start">(⊢)</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 2: A_Omega (actualized domain) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="115" y="185" width="150" height="70" rx="6" ry="6"
        fill="url(#boxGradient)" stroke="#34495e" stroke-width="1.5"/>
  <!-- A with Omega subscript - positioned manually for precision -->
  <text x="172" y="232" font-family="Times New Roman, Times, serif" font-size="36"
        font-style="italic" fill="#1a252f" text-anchor="middle">A</text>
  <text x="206" y="242" font-family="Times New Roman, Times, serif" font-size="22"
        fill="#1a252f" text-anchor="middle">Ω</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- ARROW 2: Characterization (definitional identity) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <line x1="190" y1="255" x2="190" y2="318"
        stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Characterization label -->
  <text x="210" y="285" font-family="Times New Roman, Times, serif" font-size="14"
        fill="#495057" text-anchor="start" font-style="italic">Characterization</text>
  <text x="210" y="303" font-family="Times New Roman, Times, serif" font-size="14"
        fill="#495057" text-anchor="start">(:=)</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 3: = L₃(I∞) (structural identity) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="90" y="325" width="200" height="70" rx="6" ry="6"
        fill="url(#boxGradient)" stroke="#34495e" stroke-width="1.5"/>

  <!-- Equals sign -->
  <text x="118" y="370" font-family="Times New Roman, Times, serif" font-size="30"
        fill="#1a252f" text-anchor="middle">=</text>

  <!-- L -->
  <text x="152" y="370" font-family="Times New Roman, Times, serif" font-size="30"
        font-style="italic" fill="#1a252f" text-anchor="middle">L</text>

  <!-- Subscript 3 -->
  <text x="172" y="378" font-family="Times New Roman, Times, serif" font-size="18"
        fill="#1a252f" text-anchor="middle">3</text>

  <!-- Opening parenthesis -->
  <text x="190" y="370" font-family="Times New Roman, Times, serif" font-size="30"
        fill="#1a252f" text-anchor="middle">(</text>

  <!-- I -->
  <text x="214" y="370" font-family="Times New Roman, Times, serif" font-size="30"
        font-style="italic" fill="#1a252f" text-anchor="middle">I</text>

  <!-- Superscript infinity -->
  <text x="233" y="350" font-family="Times New Roman, Times, serif" font-size="18"
        fill="#1a252f" text-anchor="middle">∞</text>

  <!-- Closing parenthesis -->
  <text x="260" y="370" font-family="Times New Roman, Times, serif" font-size="30"
        fill="#1a252f" text-anchor="middle">)</text>

</svg>