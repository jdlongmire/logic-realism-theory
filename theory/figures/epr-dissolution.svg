<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #666; }
      .section-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; fill: #333; }
      .small-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #666; }
      .math { font-family: 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #333; }
      .box-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: white; }
      .annotation { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #666; font-style: italic; }
      .conclusion { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #059669; }
      .error { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #dc2626; }
      .footer { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #888; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">EPR Paradox Dissolution under LRT</text>
  <text x="450" y="55" text-anchor="middle" class="subtitle">How global actualization dissolves the apparent paradox</text>

  <!-- Left side: EPR Framing (what EPR assumes) -->
  <rect x="30" y="80" width="380" height="400" fill="white" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="220" y="105" text-anchor="middle" class="section-title" style="fill: #dc2626;">EPR Framing (1935)</text>

  <!-- EPR assumption: Local facts -->
  <rect x="50" y="125" width="340" height="70" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
  <text x="220" y="145" text-anchor="middle" class="label" style="font-weight: bold;">Assumption 1: Local Facts</text>
  <text x="220" y="165" text-anchor="middle" class="small-label">"Elements of reality" are properties</text>
  <text x="220" y="180" text-anchor="middle" class="small-label">belonging to individual particles</text>

  <!-- EPR particles -->
  <circle cx="120" cy="245" r="25" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="250" text-anchor="middle" class="box-text">Alice</text>

  <circle cx="320" cy="245" r="25" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="250" text-anchor="middle" class="box-text">Bob</text>

  <!-- Entanglement line -->
  <line x1="145" y1="245" x2="295" y2="245" stroke="#d97706" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="220" y="238" text-anchor="middle" class="small-label">Entangled</text>

  <!-- Alice measures -->
  <path d="M120 280 L120 310" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="315" width="100" height="35" fill="#6b7280" rx="4"/>
  <text x="120" y="337" text-anchor="middle" class="box-text">Measure ↑</text>

  <!-- "Instantaneous" influence arrow -->
  <path d="M170 332 L270 285" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <text x="220" y="300" text-anchor="middle" class="error" style="font-size: 9px;">Instantaneous?</text>

  <!-- Bob's outcome fixed -->
  <path d="M320 280 L320 310" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="315" width="100" height="35" fill="#dc2626" rx="4"/>
  <text x="320" y="337" text-anchor="middle" class="box-text">Must be ↓</text>

  <!-- EPR conclusion -->
  <rect x="50" y="370" width="340" height="90" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
  <text x="220" y="395" text-anchor="middle" class="error" style="font-weight: bold;">EPR Conclusion</text>
  <text x="220" y="415" text-anchor="middle" class="small-label">Bob's outcome was predetermined</text>
  <text x="220" y="430" text-anchor="middle" class="small-label">→ Hidden variable exists</text>
  <text x="220" y="445" text-anchor="middle" class="small-label">→ QM is incomplete</text>


  <!-- Right side: LRT Resolution -->
  <rect x="430" y="80" width="440" height="400" fill="white" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="650" y="105" text-anchor="middle" class="section-title" style="fill: #059669;">LRT Resolution</text>

  <!-- LRT: Global actualization -->
  <rect x="450" y="125" width="400" height="70" fill="#ecfdf5" stroke="#6ee7b7" rx="4"/>
  <text x="650" y="145" text-anchor="middle" class="label" style="font-weight: bold;">A operates globally on I∞</text>
  <text x="650" y="165" text-anchor="middle" class="small-label">Actualization constitutes facts</text>
  <text x="650" y="180" text-anchor="middle" class="small-label">No pre-existing local properties to "discover"</text>

  <!-- I∞ space -->
  <rect x="470" y="210" width="360" height="110" fill="#f0fdf4" stroke="#86efac" rx="8" stroke-dasharray="4,4"/>
  <text x="650" y="230" text-anchor="middle" class="label" style="font-weight: bold;">I∞ (Configuration Space)</text>

  <!-- Joint configuration -->
  <ellipse cx="650" cy="275" rx="100" ry="30" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="650" y="280" text-anchor="middle" class="label">Joint configuration</text>

  <!-- A operator acting -->
  <rect x="580" y="340" width="140" height="40" fill="#059669" rx="4"/>
  <text x="650" y="365" text-anchor="middle" class="box-text" style="font-weight: bold;">A: I∞ → {0,1}</text>

  <path d="M650 310 L650 335" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- L₃ constraint annotation -->
  <rect x="750" y="255" width="90" height="50" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
  <text x="795" y="275" text-anchor="middle" class="small-label" style="font-weight: bold;">L₃ constraint:</text>
  <text x="795" y="290" text-anchor="middle" class="small-label">No (↑,↑) or (↓,↓)</text>

  <!-- Arrow from L3 to joint -->
  <path d="M750 280 L700 280" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LRT outcomes -->
  <text x="530" y="410" text-anchor="middle" class="label">Alice: ↑</text>
  <text x="770" y="410" text-anchor="middle" class="label">Bob: ↓</text>
  <path d="M600 385 L550 400" stroke="#059669" stroke-width="2"/>
  <path d="M700 385 L750 400" stroke="#059669" stroke-width="2"/>

  <!-- LRT conclusion -->
  <rect x="450" y="430" width="400" height="45" fill="#ecfdf5" stroke="#6ee7b7" rx="4"/>
  <text x="650" y="450" text-anchor="middle" class="conclusion">Correlations are constitutive constraints, not causal</text>
  <text x="650" y="467" text-anchor="middle" class="small-label">No influence travels; A evaluates the global configuration consistently</text>

  <!-- Center comparison arrow -->
  <rect x="395" y="250" width="50" height="50" fill="#f3f4f6" rx="25"/>
  <text x="420" y="280" text-anchor="middle" class="label" style="font-size: 20px;">→</text>

  <!-- Key insight box at bottom -->
  <rect x="100" y="495" width="700" height="45" fill="#1e40af" rx="4"/>
  <text x="450" y="515" text-anchor="middle" class="box-text" style="font-size: 12px;">
    The question "Was Bob's outcome predetermined?" presupposes temporal priority of hidden facts.
  </text>
  <text x="450" y="530" text-anchor="middle" class="box-text" style="font-size: 12px;">
    LRT: Determinacy IS actualization. There's nothing to be "predetermined."
  </text>
</svg>
