<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; }
      .problem { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; }
      .resolution { font-family: 'Times New Roman', serif; font-size: 10px; }
      .primitive { font-family: 'Times New Roman', serif; font-size: 14px; font-weight: bold; }
      .prim-desc { font-family: 'Times New Roman', serif; font-size: 10px; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Figure 3: Standing Problems Dissolved by LRT Primitives</text>

  <!-- Three primitive columns -->
  <!-- L3 Column -->
  <rect x="50" y="50" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#2c5aa0" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" class="primitive">L₃</text>
  <text x="150" y="95" text-anchor="middle" class="prim-desc">Logical Constraint</text>

  <!-- I∞ Column -->
  <rect x="300" y="50" width="200" height="60" rx="5" fill="#f4f8e8" stroke="#5aa02c" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" class="primitive">I∞</text>
  <text x="400" y="95" text-anchor="middle" class="prim-desc">Information Space</text>

  <!-- A Column -->
  <rect x="550" y="50" width="200" height="60" rx="5" fill="#f8e8f4" stroke="#a02c5a" stroke-width="2"/>
  <text x="650" y="75" text-anchor="middle" class="primitive">A</text>
  <text x="650" y="95" text-anchor="middle" class="prim-desc">Actualization</text>

  <!-- Problems dissolved by L3 -->
  <rect x="50" y="140" width="200" height="70" rx="5" fill="#fff" stroke="#2c5aa0" stroke-width="1"/>
  <text x="150" y="160" text-anchor="middle" class="problem">Wave-Particle Duality</text>
  <text x="150" y="178" text-anchor="middle" class="resolution">Projections in ℂℋ admit both</text>
  <text x="150" y="193" text-anchor="middle" class="resolution">representations; L₃ determines</text>
  <text x="150" y="208" text-anchor="middle" class="resolution">which obtains at measurement</text>
  <line x1="150" y1="115" x2="150" y2="135" stroke="#2c5aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="50" y="230" width="200" height="70" rx="5" fill="#fff" stroke="#2c5aa0" stroke-width="1"/>
  <text x="150" y="250" text-anchor="middle" class="problem">Preferred Basis</text>
  <text x="150" y="268" text-anchor="middle" class="resolution">L₃ enforces determinacy;</text>
  <text x="150" y="283" text-anchor="middle" class="resolution">basis selection follows from</text>
  <text x="150" y="298" text-anchor="middle" class="resolution">actualization constraints</text>
  <line x1="150" y1="115" x2="150" y2="225" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Problems dissolved by I∞ -->
  <rect x="300" y="140" width="200" height="70" rx="5" fill="#fff" stroke="#5aa02c" stroke-width="1"/>
  <text x="400" y="160" text-anchor="middle" class="problem">EPR / Nonlocality</text>
  <text x="400" y="178" text-anchor="middle" class="resolution">Correlations encoded in I∞;</text>
  <text x="400" y="193" text-anchor="middle" class="resolution">A resolves jointly, not via</text>
  <text x="400" y="208" text-anchor="middle" class="resolution">signal propagation</text>
  <line x1="400" y1="115" x2="400" y2="135" stroke="#5aa02c" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="300" y="230" width="200" height="70" rx="5" fill="#fff" stroke="#5aa02c" stroke-width="1"/>
  <text x="400" y="250" text-anchor="middle" class="problem">Schrödinger's Cat</text>
  <text x="400" y="268" text-anchor="middle" class="resolution">Superposition in I∞; A selects</text>
  <text x="400" y="283" text-anchor="middle" class="resolution">definite outcome; no "both"</text>
  <text x="400" y="298" text-anchor="middle" class="resolution">state ever obtains in A_Ω</text>
  <line x1="400" y1="115" x2="400" y2="225" stroke="#5aa02c" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Problems dissolved by A -->
  <rect x="550" y="140" width="200" height="70" rx="5" fill="#fff" stroke="#a02c5a" stroke-width="1"/>
  <text x="650" y="160" text-anchor="middle" class="problem">Measurement Problem</text>
  <text x="650" y="178" text-anchor="middle" class="resolution">A is primitive; collapse is</text>
  <text x="650" y="193" text-anchor="middle" class="resolution">actualization, not additional</text>
  <text x="650" y="208" text-anchor="middle" class="resolution">dynamics requiring explanation</text>
  <line x1="650" y1="115" x2="650" y2="135" stroke="#a02c5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="550" y="230" width="200" height="70" rx="5" fill="#fff" stroke="#a02c5a" stroke-width="1"/>
  <text x="650" y="250" text-anchor="middle" class="problem">The Observer</text>
  <text x="650" y="268" text-anchor="middle" class="resolution">A operates universally; no</text>
  <text x="650" y="283" text-anchor="middle" class="resolution">privileged observer role;</text>
  <text x="650" y="298" text-anchor="middle" class="resolution">consciousness not required</text>
  <line x1="650" y1="115" x2="650" y2="225" stroke="#a02c5a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Combined (two-level) box -->
  <rect x="200" y="340" width="400" height="80" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" class="primitive">Two-Level Ontology</text>
  <text x="400" y="385" text-anchor="middle" class="resolution" style="font-size: 11px;">I∞: possibility space (superpositions, entanglement, interference)</text>
  <text x="400" y="402" text-anchor="middle" class="resolution" style="font-size: 11px;">A_Ω: actualized domain (definite outcomes, classical appearance)</text>
  <text x="400" y="419" text-anchor="middle" class="resolution" style="font-size: 11px; font-weight: bold;">Measurement = A selecting from I∞ under L₃ constraints</text>

  <!-- Arrows from primitives to combined box -->
  <line x1="150" y1="305" x2="250" y2="335" stroke="#2c5aa0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="305" x2="400" y2="335" stroke="#5aa02c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="305" x2="550" y2="335" stroke="#a02c5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Summary footer -->
  <text x="400" y="460" text-anchor="middle" class="resolution" style="font-size: 11px; font-style: italic;">
    These problems dissolve rather than being solved: they presuppose a framework LRT replaces.
  </text>
  <text x="400" y="478" text-anchor="middle" class="resolution" style="font-size: 11px; font-style: italic;">
    The "mystery" was an artifact of taking unitary evolution as fundamental and asking what breaks it.
  </text>
</svg>
