<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; }
      .primitive { font-family: 'Times New Roman', serif; font-size: 16px; font-weight: bold; }
      .label { font-family: 'Times New Roman', serif; font-size: 12px; }
      .sublabel { font-family: 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #555; }
      .result { font-family: 'Times New Roman', serif; font-size: 14px; font-weight: bold; }
      .equation { font-family: 'Times New Roman', serif; font-size: 13px; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" class="title">Figure 1: The Primitive Ontology χ = [L₃ : I∞ : A]</text>

  <!-- Three primitives in triangle -->
  <!-- L3 (top) -->
  <circle cx="250" cy="100" r="45" fill="#e8f4f8" stroke="#2c5aa0" stroke-width="2"/>
  <text x="250" y="95" text-anchor="middle" class="primitive">L₃</text>
  <text x="250" y="112" text-anchor="middle" class="sublabel">Logical Constraint</text>

  <!-- I∞ (bottom left) -->
  <circle cx="130" cy="250" r="45" fill="#f4f8e8" stroke="#5aa02c" stroke-width="2"/>
  <text x="130" y="245" text-anchor="middle" class="primitive">I∞</text>
  <text x="130" y="262" text-anchor="middle" class="sublabel">Information Space</text>

  <!-- A (bottom right) -->
  <circle cx="370" cy="250" r="45" fill="#f8e8f4" stroke="#a02c5a" stroke-width="2"/>
  <text x="370" y="245" text-anchor="middle" class="primitive">A</text>
  <text x="370" y="262" text-anchor="middle" class="sublabel">Actualization</text>

  <!-- Bidirectional constitution arrows -->
  <!-- L3 to I∞ -->
  <line x1="210" y1="130" x2="165" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="175" y1="215" x2="220" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="165" y="170" class="label" transform="rotate(-55, 165, 170)">constrains</text>

  <!-- L3 to A -->
  <line x1="290" y1="130" x2="335" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="325" y1="215" x2="280" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="335" y="170" class="label" transform="rotate(55, 335, 170)">governs</text>

  <!-- I∞ to A -->
  <line x1="180" y1="255" x2="320" y2="255" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="245" x2="180" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="250" y="238" text-anchor="middle" class="label">domain of</text>

  <!-- Central chi symbol -->
  <text x="250" y="200" text-anchor="middle" style="font-family: 'Times New Roman', serif; font-size: 28px; font-weight: bold; fill: #333;">χ</text>

  <!-- Result box at bottom -->
  <rect x="100" y="330" width="300" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="5"/>
  <text x="250" y="352" text-anchor="middle" class="result">Actualized Domain</text>
  <text x="250" y="370" text-anchor="middle" class="equation">A_Ω = L₃(I∞)</text>

  <!-- Arrow from chi to result -->
  <line x1="250" y1="220" x2="250" y2="325" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="270" y="280" class="label">grounds</text>
</svg>
