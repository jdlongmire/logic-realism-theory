# QM-003: Local Tomography
id: QM-003
name: Local Tomography
statement: |
  Local tomography holds: the joint state of a composite system
  is uniquely determined by the statistics of local measurements
  on its components. This is the conjunction of H1 and H2.

role: derived
proof_status: axiomatized
epistemic_status: argued

formal_artifacts:
  lean:
    - file: Step3_LocalTomography.lean
      symbol: LocalTomography
      status: sorry

source_documents:
