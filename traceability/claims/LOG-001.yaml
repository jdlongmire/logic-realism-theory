# LOG-001: Determinate Identity
id: LOG-001
name: Determinate Identity
statement: |
  Every actualized configuration has determinate identity: for any
  configuration c ∈ AΩ and any property P, either P(c) or ¬P(c).
  There is no ontic indeterminacy at the level of actualization.

role: derived
proof_status: verified
epistemic_status: established

formal_artifacts:
  lean:
    - file: Step2_DeterminateIdentity.lean
      symbol: DeterminateIdentity
      status: proven
    - file: Step0_Primitives.lean
      symbol: ActionPrimitive.determinate
      status: proven

source_documents:
  - doc: LRT-MASTER
    section: "3.1"

depends_on:
  - claim_id: ONT-003
    dependency_type: logical
  - claim_id: ACT-002
    dependency_type: logical

risk_if_false: |
  Without determinate identity, Boolean event structure fails.
  Projection operators cannot be derived.

notes: |
  This follows directly from L₃ (excluded middle) applied to
  actualized configurations.
