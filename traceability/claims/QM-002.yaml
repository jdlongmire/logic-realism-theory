# QM-002: H2 Operational Local Tomography
id: QM-002
name: H2 Operational Local Tomography
statement: |
  Local measurements on subsystems A and B suffice to determine
  the joint state of AB. No irreducibly global measurement is needed.

role: derived
proof_status: verified
epistemic_status: established

