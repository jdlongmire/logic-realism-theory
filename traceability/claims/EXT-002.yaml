# EXT-002: Gleason's Theorem
id: EXT-002
name: Gleason's Theorem
statement: |
  Any probability measure μ on the projection lattice of a Hilbert
  space H with dim(H) ≥ 3 has the form μ(P) = Tr(ρP) for some
  density operator ρ.

role: imported
proof_status: imported
epistemic_status: established

formal_artifacts:
  lean:
    - file: Step6_BornRule.lean
      symbol: gleason_theorem
      status: axiom

source_documents:
  - doc: LRT-MASTER
    section: "3.6"

depends_on:
  - claim_id: QM-007
    dependency_type: formal

external_citations:
  - "Gleason, A.M. (1957). Measures on the closed subspaces of a Hilbert space. Journal of Mathematics and Mechanics 6, 885-893"

risk_if_false: |
  Gleason's theorem is established mathematics. If it were false,
  most of quantum foundations would need revision.

notes: |
  LRT imports Gleason rather than re-proving it. The work is in
  showing LRT satisfies the premises (projections, dim ≥ 3).

