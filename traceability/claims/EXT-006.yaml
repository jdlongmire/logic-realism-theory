depends_on: []

external_citations:
  - "Reed, M. & Simon, B. (1980). Methods of Modern Mathematical Physics I: Functional Analysis. Academic Press. Ch. VIII"
  - "Stone, M.H. (1932). On one-parameter unitary groups in Hilbert space. Annals of Mathematics 33, 643-648"

risk_if_false: |
  This follows directly from the spectral theorem and functional
  calculus. It's the foundation of quantum dynamics. If false,
  unitary evolution would not preserve norms.

notes: |
  Reclassified from REMAINING to EXTERNAL on 2026-03-21.

  This is a consequence of the spectral theorem for self-adjoint
  operators. For bounded H, Mathlib can prove this. For unbounded H
  (physical Hamiltonians), the infrastructure is missing.

  LRT imports this as established mathematics rather than
  treating it as an open derivation target.

