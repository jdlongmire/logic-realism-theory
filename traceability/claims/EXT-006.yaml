# EXT-006: Self-Adjoint Exponential is Unitary
id: EXT-006
name: exp(iH) is Unitary for Self-Adjoint H
statement: |
  For a self-adjoint operator H on a Hilbert space,
  exp(iH)† = exp(-iH), making exp(iH) unitary.

role: imported
proof_status: imported
epistemic_status: established

formal_artifacts:
  lean:
