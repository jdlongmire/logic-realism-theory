# EXT-003: Stone's Theorem
id: EXT-003
name: Stone's Theorem
statement: |
  Every strongly continuous one-parameter unitary group U(t) on
  a Hilbert space has the form U(t) = exp(-iHt) for some self-adjoint
  operator H (the generator).

role: imported
proof_status: imported
epistemic_status: established

formal_artifacts:
  lean:
    - file: Step9_EnergyAction.lean
      symbol: stones_theorem
      status: axiom
    - file: Step9_EnergyAction.lean
      symbol: StronglyContUnitaryGroup
      status: definition
    - file: Step9_EnergyAction.lean
      symbol: stones_theorem_from_group
      status: theorem

