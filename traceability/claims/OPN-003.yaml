# OPN-003: Separation Theorem
id: OPN-003
name: Separation Theorem for Local Tomography
statement: |
  For any two composite states rho_1, rho_2 in I_inf with rho_1 != rho_2
  (under the distinguishability metric D), there exist local measurements
  M_A, M_B such that the joint statistics p(a,b|M_A,M_B) differ for
  rho_1 and rho_2.

role: open
proof_status: open
epistemic_status: argued

source_documents:
  - doc: 002-LRT-CORE-PHYSICS
    section: "9.2"

depends_on:
  - claim_id: QM-001
    dependency_type: logical
  - claim_id: QM-002
    dependency_type: logical
  - claim_id: LOG-001
    dependency_type: logical

risk_if_false: |
  Without the separation theorem, the H1-to-H2 bridge remains argued
  rather than established. Step 3 (local tomography) stays at ARGUED
  epistemic status.

notes: |
  Created 2026-03-27. Proving this within LRT would elevate Step 3
  from ARGUED to ESTABLISHED. Appropriate target for Lean formalization.
