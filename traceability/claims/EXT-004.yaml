# EXT-004: Schrödinger from Stone Generator
id: EXT-004
name: Schrödinger Equation from Stone Generator
statement: |
  Given a strongly continuous one-parameter unitary group U(t) with
  self-adjoint generator H (via Stone's theorem), differentiating
  U(t)ψ with respect to t yields iℏ(dψ/dt) = Hψ.

role: imported
proof_status: imported
epistemic_status: established

