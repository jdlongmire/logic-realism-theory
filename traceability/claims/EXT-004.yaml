  - "Reed, M. & Simon, B. (1980). Methods of Modern Mathematical Physics I: Functional Analysis. Academic Press. Ch. VIII"

risk_if_false: |
  This is a standard consequence of Stone's theorem and the definition
  of the generator. If false, functional analysis would need revision.

notes: |
  Reclassified from REMAINING to EXTERNAL on 2026-03-21.

  The mathematics is established (Stone 1932, Reed-Simon). Mathlib lacks
  unbounded operator theory infrastructure to formalize this. LRT imports
  the endpoint rather than pretending it's an open derivation.

  This is honest classification: we rely on established functional analysis,
