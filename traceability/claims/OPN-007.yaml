# OPN-007: Action Principle from X
id: OPN-007
name: Action Principle from X (Quantum Action on State Space)
statement: |
  The quantum action on state space CP(H) is:
    S[gamma] = hbar * integral(A_FS) - integral(<H> dt)
  where A_FS is the Fubini-Study connection (from D, Step 4) and
  <H> is the Hamiltonian expectation (from Stone, Step 10).
  Hamilton's principle (delta S = 0) recovers the Schrodinger equation.

role: derived
proof_status: prose_only
epistemic_status: established

source_documents:
  - doc: 002-LRT-CORE-PHYSICS
    section: "5.7.3"
  - doc: 002-LRT-CORE-PHYSICS
    section: "9.7"

depends_on:
