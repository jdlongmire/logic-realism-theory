    - file: Step3_LocalTomography.lean
      symbol: lrt_derives_h1
      status: proven
    - file: Step3_LocalTomography.lean
      symbol: local_events_determine_config
      status: proven
    - file: Step0_Primitives.lean
      symbol: config_separation
      status: axiom
    - file: Step0_Primitives.lean
      symbol: configs_determined_by_events
      status: proven

