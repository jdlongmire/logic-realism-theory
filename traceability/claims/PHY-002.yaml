    dependency_type: logical
  - claim_id: ACT-001
    dependency_type: logical

risk_if_false: |
  If time is primitive, LRT loses parsimony and the emergence
  narrative fails.

notes: |
  LRT holds that time IS the actualization sequencing. Actualizations are
  discrete (ℕ-indexed). The continuum time parameter is a coordinate system
  for these discrete events. Continuous dynamics (Stone's theorem, Schrödinger
  equation) describes interpolation between actualizations.

