# PHY-002: Temporal Emergence
id: PHY-002
name: Temporal Emergence
statement: |
  Time is not primitive but emerges from the discrete sequencing of
  actualization events. Actualizations are ℕ-indexed; the time parameter t
  provides real-valued coordinates for this discrete sequence. Continuous
  physics (Schrödinger equation) interpolates between discrete actualizations.

