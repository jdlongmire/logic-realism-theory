# EXT-005: Exponential Additivity for Commuting Operators
id: EXT-005
name: exp(A+B) = exp(A)exp(B) for Commuting Operators
statement: |
  For unbounded self-adjoint operators A, B on a Hilbert space with
  [A, B] = 0 (on appropriate domain), the functional calculus gives
  exp(A + B) = exp(A) · exp(B).

role: imported
proof_status: imported
epistemic_status: established

formal_artifacts:
