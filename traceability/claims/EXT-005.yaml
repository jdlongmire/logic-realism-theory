  - "Kato, T. (1966). Perturbation Theory for Linear Operators. Springer"

risk_if_false: |
  This is a standard result in functional calculus for self-adjoint
  operators. If false, spectral theory would need major revision.

notes: |
  Reclassified from REMAINING to EXTERNAL on 2026-03-21.

  Mathlib has this for bounded operators (NormedSpace.exp_add_of_commute)
  but not for unbounded operators. The mathematics is established;
  the infrastructure is missing.

  LRT imports this as an external theorem rather than pretending
  it's derivable within our formalization scope.

