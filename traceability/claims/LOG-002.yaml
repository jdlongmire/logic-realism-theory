# LOG-002: Physical Proposition Criterion
id: LOG-002
name: Physical Proposition Criterion
statement: |
  A physical proposition is a predicate E over configurations that
  respects L₃: for every c ∈ I∞, either E(c) or ¬E(c) holds, and
  never both. Physical propositions form a Boolean algebra under
  conjunction, disjunction, and negation.

role: derived
proof_status: verified
epistemic_status: established

formal_artifacts:
  lean:
    - file: Step0_Primitives.lean
      symbol: Event
      status: proven
    - file: Step0_Primitives.lean
      symbol: event_lnc
      status: proven
    - file: Step0_Primitives.lean
      symbol: event_lem
      status: proven

source_documents:
  - doc: LRT-MASTER
    section: "3.2"

depends_on:
  - claim_id: ONT-003
    dependency_type: logical
  - claim_id: LOG-001
    dependency_type: logical

risk_if_false: |
  Without Boolean event structure, the bridge to projection
  operators is blocked.

notes: |
  Events are queries over configurations. L₃ forces them to be
  classical (Boolean), not quantum logic.
