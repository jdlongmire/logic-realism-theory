# QM-005: Boolean Actualization
id: QM-005
name: Boolean Actualization
statement: |
  Actualization is Boolean: for any event E and configuration c,
  A(E,c) ∈ {0,1}. Events are either actual or not, never partially
  actual. This follows from L₃ (excluded middle, non-contradiction).

role: derived
proof_status: verified
epistemic_status: established

formal_artifacts:
  lean:
    - file: Step0_Primitives.lean
      symbol: ActualityValue
      status: proven
    - file: Step0_Primitives.lean
      symbol: ActionPrimitive.determinate
      status: proven

source_documents:
  - doc: LRT-MASTER
    section: "3.5"

depends_on:
  - claim_id: ONT-003
    dependency_type: logical
  - claim_id: LOG-002
    dependency_type: logical

risk_if_false: |
  Boolean actualization is the key bridge to projection operators.
  Without it, the spectrum restriction argument fails.

notes: |
  This is where ontology meets operator theory. Boolean values
  become eigenvalue constraints.
