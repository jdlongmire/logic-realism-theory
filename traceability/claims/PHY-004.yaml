# PHY-004: Schrödinger Equation
id: PHY-004
name: Schrödinger Equation
statement: |
  The time evolution of quantum states satisfies iℏ ∂ψ/∂t = Hψ.
  This follows from U(t) = exp(-iHt/ℏ) via differentiation.

role: derived
proof_status: axiomatized
epistemic_status: argued

formal_artifacts:
  lean:
    - file: Step10_Schrodinger.lean
      symbol: schrodinger_equation
      status: axiom

source_documents:
