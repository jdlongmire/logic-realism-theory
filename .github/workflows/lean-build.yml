name: Lean Build

on:
  push:
    branches: [ master, main ]
    paths:
      - 'formalization/**'
      - '.github/workflows/lean-build.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'formalization/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Get Lean version
      run: |
        cd formalization
        cat lean-toolchain

    - name: Cache Mathlib
      uses: actions/cache@v3
      with:
        path: |
          ~/.elan
          formalization/.lake
        key: ${{ runner.os }}-lean-${{ hashFiles('formalization/lean-toolchain') }}-${{ hashFiles('formalization/lake-manifest.json') }}
        restore-keys: |
          ${{ runner.os }}-lean-${{ hashFiles('formalization/lean-toolchain') }}-
          ${{ runner.os }}-lean-

    - name: Build Lean project
      run: |
        cd formalization
        lake exe cache get
        lake build

    - name: Report axiom count
      run: |
        AXIOM_COUNT=$(grep -r "^axiom " formalization/LrtFormalization --include="*.lean" | wc -l)
        echo "Total axioms in LRT: $AXIOM_COUNT"
        if [ "$AXIOM_COUNT" -gt 3 ]; then
          echo "WARNING: More than 3 PRIMITIVE axioms found!"
          grep -rn "^axiom " formalization/LrtFormalization --include="*.lean"
        else
          echo "SUCCESS: Axiom minimalism maintained (≤3 primitives)"
        fi

    - name: Report sorry count
      run: |
        SORRY_COUNT=$(grep -r "sorry" formalization/LrtFormalization --include="*.lean" | grep -v "^--" | wc -l)
        echo "Sorry count: $SORRY_COUNT"
        if [ "$SORRY_COUNT" -gt 0 ]; then
          echo "WARNING: $SORRY_COUNT sorry(s) found!"
          grep -rn "sorry" formalization/LrtFormalization --include="*.lean" | grep -v "^--"
        else
          echo "SUCCESS: Zero sorries — all proofs complete"
        fi
