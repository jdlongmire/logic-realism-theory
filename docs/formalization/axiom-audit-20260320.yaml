    reduction_path: |
      1. Assume U(t) = exp(-iHt)
      2. -iHs and -iHt commute (both scalar multiples of H)
      3. exp(-iH(s+t)) = exp(-iHs)exp(-iHt) by Baker-Campbell-Hausdorff
      4. Therefore U(s+t) = U(s)U(t)
